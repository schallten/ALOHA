[package]
name = "aloha"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
fluxer-core = { version = "0.3.1", default-features = false }
fluxer-rest     = "0.3.1"
fluxer-builders = "0.3.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.154"
