[project]
name = "aloha"
version = "0.1.0"
description = "ALOHA pairs up strangers so they can talk to each other from their own channels, even across different servers. A fluxer.app bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # rework branch (0.5.0-alpha.5) - not published to PyPI yet
    "fluxer-py @ git+https://github.com/Fluxer-py/fluxer.py@rework",
    "python-dotenv>=1.0",
]

[project.scripts]
aloha = "main:main"
start = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "constants", "pacer", "sanitize", "state"]